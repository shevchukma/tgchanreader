# Необязательный файл со списком каналов. Положите его как data/channels.yml
# (или укажите путь в CHANNELS_FILE). При каждом запуске каналы из файла
# добавляются, а их теги/приоритет обновляются. Каналы, добавленные через бота,
# не удаляются. Названия ниже — примеры, замените на свои.
channels:
  - name: "@example_news"
    tags: [новости, город]
    priority: 1
  - name: https://t.me/example_velo
    tags: [велосипед]
    priority: 3
  - "@example_blog"      # без тегов, приоритет по умолчанию
