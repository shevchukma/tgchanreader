services:
  tgchanreader:
    image: velikoross/tgchanreader:latest
    # build: .   # раскомментируйте, чтобы собрать образ локально
    container_name: tgchanreader
    restart: unless-stopped
    env_file: .env
    # Веб-архив и RSS. Порт открыт только для самого сервера; чтобы публиковать наружу,
    # поставьте перед ним reverse proxy с HTTPS (Caddy, nginx) и задайте WEB_BASE_URL.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
